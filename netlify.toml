[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Payload збирає адмінку — потрібно більше пам'яті, ніж дає типовий ліміт
  NODE_OPTIONS = "--max-old-space-size=4096"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Адмінка й API не кешуються: дані завжди свіжі
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Захист від вбудовування сторінок у чужий сайт: без цього адмінку можна
# показати в невидимому вікні поверх сторонньої сторінки й ловити натискання.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=(), interest-cohort=()"
